services:
  registry-cache1:
    restart: always
    image: registry:3
    environment:
      REGISTRY_PROXY_REMOTEURL: '${UPSTREAM1_REGISTRY:-https://registry-1.docker.io}'
      REGISTRY_PROXY_USERNAME: '${USERNAME1:-}'
      REGISTRY_PROXY_PASSWORD: '${PASSWORD1:-}'
      OTEL_TRACES_EXPORTER: none
    labels:
      - "traefik.http.routers.cache1.rule=Host(`${CACHE_DOMAIN1}`)"
      - "traefik.http.routers.cache1.service=cache1"
      - "traefik.http.routers.cache1.tls=true"
      - "traefik.http.routers.cache1.tls.certresolver=letsencrypt"
      - "traefik.http.services.cache1.loadbalancer.server.scheme=http"
      - "traefik.http.services.cache1.loadbalancer.server.port=5000"
      - "traefik.enable=true"
