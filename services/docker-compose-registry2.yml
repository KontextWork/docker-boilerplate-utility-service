services:
  registry-cache2:
    restart: always
    image: registry:2
    environment:
      REGISTRY_PROXY_REMOTEURL: '${UPSTREAM_REGISTRY2:-https://registry-1.docker.io}'
      REGISTRY_PROXY_USERNAME: '${USERNAME2:-}'
      REGISTRY_PROXY_PASSWORD: '${PASSWORD2:-}'
    labels:
      - "traefik.http.routers.cache2.rule=Host(`${CACHE_DOMAIN2}`)"
      - "traefik.http.routers.cache2.service=cache2"
      - "traefik.http.routers.cache2.tls=true"
      - "traefik.http.routers.cache2.tls.certresolver=letsencrypt"
      - "traefik.http.services.cache2.loadbalancer.server.scheme=http"
      - "traefik.http.services.cache2.loadbalancer.server.port=5000"
      - "traefik.enable=true"
